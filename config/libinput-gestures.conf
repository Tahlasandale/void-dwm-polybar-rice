# Seuil pour les gestes 3 et 4 doigts
swipe_threshold 20

# 3 doigts -> navigation entre bureaux dans dwm
gesture swipe left 3 xdotool key super+Right
gesture swipe right 3 xdotool key super+Left

# 4 doigts -> défilement horizontal dans l'application (boutons souris 6/7)
# Le scroll 2 doigts est natif (libinput) et ne passe pas par libinput-gestures.
gesture swipe left 4 xdotool click --repeat 5 --delay 40 7
gesture swipe right 4 xdotool click --repeat 5 --delay 40 6
