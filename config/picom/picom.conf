# Effets de composition pour dwm — Catppuccin Mocha
# Lié dans ~/.config/picom/picom.conf par deploy.sh

# Coins arrondis (dmenu est déjà arrondi dans sa source, polybar reste pleine largeur)
corner-radius = 12;
rounded-corners-exclude = [
    "name = 'polybar'",
    "class_g = 'dmenu'",
    "class_g = 'i3lock'"
];

# Flou léger du fond derrière les fenêtres translucides (dual_kawase = peu coûteux)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 3;
blur-background-fixed = true;
blur-background-exclude = [
    "name = 'polybar'",
    "class_g = 'dmenu'",
    "class_g = 'i3lock'",
    "fullscreen"
];

# Transparence légère : Firefox reste opaque, Alacritty garde ses 0.88
active-opacity = 0.97;
inactive-opacity = 0.95;
opacity-rule = [
    "88:class_g = 'Alacritty'",
    "100:class_g = 'Firefox'",
    "100:name = 'polybar'",
    "100:class_g = 'dmenu'",
    "100:class_g = 'i3lock'"
];

fade = true;
