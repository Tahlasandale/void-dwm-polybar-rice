; Cuts-style Polybar for dwm on Void Linux
; Adapté de adi1090x/polybar-themes (simple/cuts) aux couleurs Catppuccin.

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/cuts/user_modules.ini

[bar/main]
width = 100%
height = 28pt
radius = 0

; dwm anybar compatibility
override-redirect = false
fixed-center = true

background = ${colors.background-alt}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.primary}

border-bottom-size = 1pt
border-bottom-color = ${colors.border}

padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0

separator =

font-0 = "JetBrainsMono Nerd Font:size=10;4"
font-1 = "Font Awesome 6 Free:style=Solid:size=12;3"
font-2 = "JetBrainsMono Nerd Font:size=19;3"
font-3 = "Font Awesome 6 Brands:size=11;3"
font-4 = "JetBrainsMono Nerd Font:size=7;4"

modules-left = xworkspaces decor1 media decor2
modules-center = xwindow
modules-right = decor3 mic volume bluetooth network syncthing cpu memory temperature brightness battery date power decor4

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format-background = ${colors.background}
format-padding = 1

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/media]
type = custom/script
exec = ~/.local/bin/bar/block-media
interval = 2
click-left = playerctl play-pause 2>/dev/null || mpc toggle 2>/dev/null
click-right = playerctl next 2>/dev/null || mpc next 2>/dev/null
format = <label>
format-foreground = ${colors.primary}
format-background = ${colors.background}
format-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:28:...%
label-foreground = ${colors.foreground-alt}
format-background = ${colors.background}
format-padding = 1

[module/mic]
type = custom/script
exec = ~/.local/bin/bar/block-mic
interval = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-mic
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-mic
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-mic
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-mic
format-background = ${colors.background}
format-padding = 1

[module/volume]
type = custom/script
exec = ~/.local/bin/bar/block-volume
interval = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-volume
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-volume
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-volume
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-volume
format-background = ${colors.background}
format-padding = 1

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/bar/block-bluetooth
interval = 3
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-bluetooth
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-bluetooth
format-background = ${colors.background}
format-padding = 1

[module/network]
type = custom/script
exec = ~/.local/bin/bar/block-network
interval = 3
click-left = alacritty -T "Network Manager" -e nmtui
click-right = alacritty -T "Network Manager" -e nmtui
format-background = ${colors.background}
format-padding = 1

[module/syncthing]
type = custom/script
exec = ~/.local/bin/bar/block-syncthing
interval = 2
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-syncthing
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-syncthing
format-background = ${colors.background}
format-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
format-background = ${colors.background}
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
format-background = ${colors.background}
format-padding = 1

[module/temperature]
type = custom/script
exec = ~/.local/bin/bar/block-temperature
interval = 3
format-background = ${colors.background}
format-padding = 1

[module/brightness]
type = custom/script
exec = ~/.local/bin/bar/block-brightness
interval = 2
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-brightness
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-brightness
format-background = ${colors.background}
format-padding = 1

[module/battery]
type = custom/script
exec = ~/.local/bin/bar/block-battery
interval = 5
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-battery
format-background = ${colors.background}
format-padding = 1

[module/date]
type = custom/script
exec = ~/.local/bin/bar/block-clock
interval = 1
click-left = slock
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock
format-background = ${colors.background}
format-padding = 1

[module/power]
type = custom/text
format = " ⏻ "
format-foreground = ${colors.alert}
format-background = ${colors.background}
format-padding = 1
click-left = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock

[settings]
screenchange-reload = true
pseudo-transparency = false
