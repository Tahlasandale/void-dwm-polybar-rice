; Polybar Cuts Mono-Barre pour dwm
; Thème adi1090x adapté aux couleurs Catppuccin Mocha

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/cuts/bars.ini
include-file = ~/.config/polybar/cuts/modules.ini
include-file = ~/.config/polybar/cuts/user_modules.ini

[bar/top]
inherit = bar/main
override-redirect = false
bottom = false

modules-left = launcher decor1 decor2 xworkspaces decor1 decor2 title decor1
modules-right = decor2 cpu memory temperature decor1 decor2 network tailscale syncthing bluetooth mic brightness volume caps decor1 decor2 battery date sysmenu

[settings]
screenchange-reload = true
pseudo-transparency = false
