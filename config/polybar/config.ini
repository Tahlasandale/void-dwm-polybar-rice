; Cuts à deux barres pour dwm sur Void Linux
; Inspiré de adi1090x/polybar-themes (simple/cuts), adapté aux couleurs Catppuccin.
; La barre haute est gérée par dwm (altbar), la barre basse est indépendante.

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/cuts/bars.ini
include-file = ~/.config/polybar/cuts/modules.ini
include-file = ~/.config/polybar/cuts/user_modules.ini

[bar/top]
inherit = bar/main
override-redirect = false
bottom = false

modules-left = launcher title decor1 decor2 xworkspaces decor1 decor2 color-switch decor1
modules-right = decor4 updates decor3 decor4 temperature battery keyboard decor3 decor4 date sysmenu

[bar/bottom]
inherit = bar/main
override-redirect = true
bottom = true

modules-left = media decor3 decor4 cpu memory filesystem decor3
modules-right = decor2 mic network bluetooth syncthing volume brightness decor1 decor2

[settings]
screenchange-reload = true
pseudo-transparency = false
