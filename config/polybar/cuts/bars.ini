;; Base commune de la barre - Cuts adi1090x
[bar/main]
width = 100%
height = 28
fixed-center = true

background = ${colors.bar-bg}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0
padding = 0
module-margin-left = 0
module-margin-right = 0
separator =

font-0 = "Maple Mono NF:style=Regular:size=10;3"
font-1 = "feather:style=Medium:size=12;3"
font-2 = "Iosevka Nerd Font:style=Medium:size=19;3"
font-3 = "Font Awesome 6 Free:style=Solid:size=11;3"
font-4 = "Maple Mono NF:style=Bold:size=10;3"
font-5 = "Symbols Nerd Font:style=Regular:size=14;3"

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
