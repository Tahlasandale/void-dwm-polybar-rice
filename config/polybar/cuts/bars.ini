;; Base commune aux deux barres — inspiré de adi1090x/polybar-themes (simple/cuts)
;; Adapté aux polices et à la palette locales.

[bar/main]
width = 100%
height = 28
fixed-center = true

background = ${colors.bar-bg}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0
padding = 0
module-margin-left = 0
module-margin-right = 0
separator =

font-0 = "JetBrainsMono Nerd Font:size=10;4"
font-1 = "Font Awesome 6 Free:style=Solid:size=12;3"
font-2 = "JetBrainsMono Nerd Font:size=19;3"
font-3 = "Font Awesome 6 Brands:size=11;3"
font-4 = "Maple Mono NF:size=7;4"

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
