;; Modules Polybar Cuts - Rice Catppuccin Mocha dwm

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
format-background = ${colors.background}
format-padding = 0

label-active = %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.disabled}
label-occupied-background = ${colors.background}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-empty-padding = 1

[module/title]
type = internal/xwindow
format = <label>
format-background = ${colors.background}
format-padding = 1
label = " %title:0:14:...% "
label-maxlen = 16
label-minlen = 16
label-alignment = left
label-foreground = ${colors.white}
label-empty = " Bureau "
label-empty-foreground = ${colors.white}

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = "%{T6}󰘚%{T-} "
format-prefix-foreground = ${colors.primary}
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
label = "%percentage:-3%%"

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-prefix = "%{T6}󰍛%{T-} "
format-prefix-foreground = ${colors.primary}
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
label = "%percentage_used:-3%%"

[module/temperature]
type = custom/script
exec = ~/.local/bin/bar/block-temperature
interval = 3
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1

[module/network]
type = custom/script
exec = ~/.local/bin/bar/block-network
interval = 3
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
click-left = alacritty -T "Network Manager" -e nmtui &
click-right = alacritty -T "Network Manager" -e nmtui &

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/bar/block-bluetooth
interval = 3
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-bluetooth &
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-bluetooth &

[module/brightness]
type = custom/script
exec = ~/.local/bin/bar/block-brightness
interval = 2
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-brightness
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-brightness

[module/volume]
type = custom/script
exec = ~/.local/bin/bar/block-volume
interval = 1
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-volume
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-volume
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-volume
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-volume

[module/battery]
type = custom/script
exec = ~/.local/bin/bar/block-battery
interval = 5
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-battery

[module/date]
type = custom/script
exec = ~/.local/bin/bar/block-clock
interval = 1
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-clock &
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock &
