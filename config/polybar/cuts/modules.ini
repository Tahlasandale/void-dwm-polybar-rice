;; Modules Polybar adaptés au rice Void/dwm.
;; Les scripts sont dans ~/.local/bin/bar.

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format-background = ${colors.background}
format-padding = 1

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/title]
type = internal/xwindow
format = <label>
format-background = ${colors.background}
format-padding = 1
label = %title:0:32:...%
label-foreground = ${colors.foreground-alt}

[module/keyboard]
type = internal/xkeyboard
format = <label-layout>
format-background = ${colors.background}
format-padding = 1
label-layout = 󰌌 %layout%
label-layout-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-background = ${colors.background}
format-mounted-padding = 1
label-mounted = 󰋊 %used/%total%
label-mounted-foreground = ${colors.foreground}

[module/updates]
type = custom/script
exec = ~/.local/bin/bar/block-updates
interval = 1800
format = <label>
format-background = ${colors.background}
format-padding = 1
label = %output%
label-foreground = ${colors.yellow}
click-left = ~/.local/bin/bar/block-updates --refresh

[module/media]
type = custom/script
exec = ~/.local/bin/bar/block-media
interval = 2
format = <label>
format-foreground = ${colors.primary}
format-background = ${colors.background}
format-padding = 1
click-left = playerctl play-pause 2>/dev/null || mpc toggle 2>/dev/null
click-right = playerctl next 2>/dev/null || mpc next 2>/dev/null

[module/mic]
type = custom/script
exec = ~/.local/bin/bar/block-mic
interval = 1
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-mic
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-mic
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-mic
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-mic

[module/volume]
type = custom/script
exec = ~/.local/bin/bar/block-volume
interval = 1
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-volume
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-volume
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-volume
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-volume

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/bar/block-bluetooth
interval = 3
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-bluetooth
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-bluetooth

[module/network]
type = custom/script
exec = ~/.local/bin/bar/block-network
interval = 3
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = alacritty -T "Network Manager" -e nmtui
click-right = alacritty -T "Network Manager" -e nmtui

[module/syncthing]
type = custom/script
exec = ~/.local/bin/bar/block-syncthing
interval = 2
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-syncthing
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-syncthing

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
format-background = ${colors.background}
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
format-background = ${colors.background}
format-padding = 1

[module/temperature]
type = custom/script
exec = ~/.local/bin/bar/block-temperature
interval = 3
format = <label>
format-background = ${colors.background}
format-padding = 1

[module/brightness]
type = custom/script
exec = ~/.local/bin/bar/block-brightness
interval = 2
format = <label>
format-background = ${colors.background}
format-padding = 1
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-brightness
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-brightness

[module/battery]
type = custom/script
exec = ~/.local/bin/bar/block-battery
interval = 5
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-battery

[module/date]
type = custom/script
exec = ~/.local/bin/bar/block-clock
interval = 1
format = <label>
format-background = ${colors.background}
format-padding = 1
click-left = slock
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock
