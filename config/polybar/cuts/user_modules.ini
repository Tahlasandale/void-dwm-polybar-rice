;; Découpes et boutons Cuts adi1090x
[module/decor-glyph]
type = custom/text
format-background = ${colors.bar-bg}
format-foreground = ${colors.background}
format-padding = 0

[module/decor1]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/decor2]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/decor3]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/decor4]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/launcher]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
format-padding = 1
label = "%{T2}%{T-}"
click-left = dmenu-drun &

[module/sysmenu]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.alert}
format-padding = 1
label = "%{T2}%{T-}"
click-left = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock &
