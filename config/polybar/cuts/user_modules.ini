;; Découpes et boutons Cuts adi1090x
[module/decor-glyph]
type = custom/text
format-background = ${colors.bar-bg}
format-foreground = ${colors.background}
format-padding = 0

[module/decor1]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/decor2]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/decor3]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/decor4]
inherit = module/decor-glyph
label = "%{T3}%{T-}"

[module/launcher]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
format-padding = 1
label = "%{T3}%{T-}"
click-left = /home/bison/.local/bin/dmenu-drun &

[module/sysmenu]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.alert}
format-padding = 1
label = "%{T6}󰐥%{T-}"
click-left = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock &

[module/mic]
type = custom/script
exec = ~/.local/bin/bar/block-mic
interval = 1
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 0
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-mic
click-right = BLOCK_BUTTON=3 ~/.local/bin/bar/block-mic
scroll-up = BLOCK_BUTTON=4 ~/.local/bin/bar/block-mic
scroll-down = BLOCK_BUTTON=5 ~/.local/bin/bar/block-mic

[module/caps]
type = custom/script
exec = ~/.local/bin/bar/block-caps
interval = 2
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.white}
format-padding = 1
click-left = BLOCK_BUTTON=1 ~/.local/bin/bar/block-caps
