;; Éléments de séparation « cuts » (adi1090x/polybar-themes, simple/cuts)
;; Adaptés à JetBrainsMono Nerd Font et à la palette Catppuccin Mocha.

[module/decor-glyph]
type = custom/text
format-background = ${colors.background-alt}
format-foreground = ${colors.background}

[module/decor1]
inherit = module/decor-glyph
format = "%{T2}%{T-}"

[module/decor2]
inherit = module/decor-glyph
format = "%{T2}%{T-}"

[module/decor3]
inherit = module/decor-glyph
format = "%{T2}%{T-}"

[module/decor4]
inherit = module/decor-glyph
format = "%{T2}%{T-}"
