;; Éléments « cuts » et actions — adaptés de adi1090x/polybar-themes (simple/cuts)
;; Séparateurs teal sur fond translucide : les découpes sont visibles.

[module/decor-glyph]
type = custom/text
format = <label>
format-background = ${colors.bar-bg}
format-foreground = ${colors.primary}
format-padding = 0

[module/decor1]
inherit = module/decor-glyph
label = "%{T2}%{T-}"

[module/decor2]
inherit = module/decor-glyph
label = "%{T2}%{T-}"

[module/decor3]
inherit = module/decor-glyph
label = "%{T2}%{T-}"

[module/decor4]
inherit = module/decor-glyph
label = "%{T2}%{T-}"

[module/launcher]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
format-padding = 1
label = "%{T1}%{T-}"
click-left = ~/.local/bin/bar/launcher.sh &

[module/sysmenu]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.alert}
format-padding = 1
label = " ⏻ "
click-left = BLOCK_BUTTON=3 ~/.local/bin/bar/block-clock

[module/color-switch]
type = custom/text
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.secondary}
format-padding = 1
label = " ◐ "
click-left = ~/.local/bin/bar/color-switch.sh
