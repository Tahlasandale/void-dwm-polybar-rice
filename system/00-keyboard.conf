# 1. Règle par défaut pour tout clavier externe branché (USB / Bluetooth) : Français classique PC
Section "InputClass"
    Identifier "external-keyboard-default"
    MatchIsKeyboard "on"
    Option "XkbLayout" "fr"
    Option "XkbVariant" ""
    Option "XkbModel" "pc105"
    Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection

# 2. Surcharge spécifique pour le clavier interne Apple et keyd : Français Mac
Section "InputClass"
    Identifier "apple-internal-keyboard"
    MatchIsKeyboard "on"
    MatchProduct "Apple|keyd"
    Option "XkbLayout" "fr"
    Option "XkbVariant" "mac"
    Option "XkbModel" "pc105"
    Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection
