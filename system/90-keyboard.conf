# 1. Règle par défaut pour tout clavier externe branché (USB / Bluetooth) : Français classique PC AZERTY
Section "InputClass"
    Identifier "keyboard-external-default"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "XkbLayout" "fr"
    Option "XkbVariant" ""
    Option "XkbModel" "pc105"
    Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection

# 2. Surcharge spécifique pour le clavier interne Apple et keyd : Français Mac AZERTY
Section "InputClass"
    Identifier "keyboard-apple-internal"
    MatchIsKeyboard "on"
    MatchProduct "Apple|keyd"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "XkbLayout" "fr"
    Option "XkbVariant" "mac"
    Option "XkbModel" "pc105"
    Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection
